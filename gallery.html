<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('eh-theme'); } catch (e) {}
  if (!t) { t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<title>Gallery | EventHall</title>
<meta name="description" content="Browse weddings, birthdays, corporate events and decor at EventHall, filtered by occasion and by room.">
<link rel="canonical" href="https://www.eventhall.example/gallery.html">
<link rel="stylesheet" href="assets/css/theme.css">
</head>
<body data-page="gallery">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>

<main id="main">

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Gallery</span>
      <h1>Celebrations, captured.</h1>
      <p class="lead">Filter by occasion or by room. Select a photo to view it full size. Use the arrow keys to move between photos and Escape to close.</p>
    </div>
  </section>

  <section class="section" style="padding-top:1rem">
    <div class="container">
      <p class="filter-label" id="cat-label">Occasion</p>
      <div class="chips" id="cat-chips" role="group" aria-labelledby="cat-label">
        <button class="chip" type="button" data-cat="all" aria-pressed="true">All</button>
        <button class="chip" type="button" data-cat="weddings" aria-pressed="false">Weddings</button>
        <button class="chip" type="button" data-cat="birthdays" aria-pressed="false">Birthdays</button>
        <button class="chip" type="button" data-cat="corporate" aria-pressed="false">Corporate</button>
        <button class="chip" type="button" data-cat="decor" aria-pressed="false">Decor</button>
      </div>

      <p class="filter-label" id="room-label">Room</p>
      <div class="chips" id="room-chips" role="group" aria-labelledby="room-label">
        <button class="chip" type="button" data-room="all" aria-pressed="true">All rooms</button>
        <button class="chip" type="button" data-room="grand" aria-pressed="false">Grand Hall</button>
        <button class="chip" type="button" data-room="garden" aria-pressed="false">Garden Room</button>
        <button class="chip" type="button" data-room="ivory" aria-pressed="false">Ivory Suite</button>
      </div>

      <p id="gallery-status" class="note" role="status" aria-live="polite" style="margin-top:1.2rem"></p>

      <div class="tiles">
        <button class="tile" type="button" data-cat="weddings" data-room="grand" data-title="Candlelit head table" data-caption="Grand Hall, wedding reception">
          <span class="media" data-img="gallery-1" role="img" aria-label="Candlelit head table"></span>
          <span class="tile-cap"><strong>Candlelit head table</strong><br>Grand Hall, wedding reception</span>
        </button>
        <button class="tile" type="button" data-cat="weddings" data-room="garden" data-title="Garden ceremony" data-caption="Garden Room, ceremony">
          <span class="media" data-img="gallery-2" role="img" aria-label="Garden ceremony"></span>
          <span class="tile-cap"><strong>Garden ceremony</strong><br>Garden Room, ceremony</span>
        </button>
        <button class="tile" type="button" data-cat="weddings" data-room="grand" data-title="First dance" data-caption="Grand Hall, evening">
          <span class="media" data-img="gallery-3" role="img" aria-label="First dance"></span>
          <span class="tile-cap"><strong>First dance</strong><br>Grand Hall, evening</span>
        </button>
        <button class="tile" type="button" data-cat="birthdays" data-room="ivory" data-title="Afternoon tea" data-caption="Ivory Suite, milestone birthday">
          <span class="media" data-img="gallery-4" role="img" aria-label="Afternoon tea"></span>
          <span class="tile-cap"><strong>Afternoon tea</strong><br>Ivory Suite, milestone birthday</span>
        </button>
        <button class="tile" type="button" data-cat="birthdays" data-room="garden" data-title="Balloon arch" data-caption="Garden Room, birthday party">
          <span class="media" data-img="gallery-5" role="img" aria-label="Balloon arch"></span>
          <span class="tile-cap"><strong>Balloon arch</strong><br>Garden Room, birthday party</span>
        </button>
        <button class="tile" type="button" data-cat="birthdays" data-room="grand" data-title="Celebration dinner" data-caption="Grand Hall, long-table dinner">
          <span class="media" data-img="gallery-6" role="img" aria-label="Celebration dinner"></span>
          <span class="tile-cap"><strong>Celebration dinner</strong><br>Grand Hall, long-table dinner</span>
        </button>
        <button class="tile" type="button" data-cat="corporate" data-room="grand" data-title="Product launch" data-caption="Grand Hall, corporate event">
          <span class="media" data-img="gallery-7" role="img" aria-label="Product launch stage"></span>
          <span class="tile-cap"><strong>Product launch</strong><br>Grand Hall, corporate event</span>
        </button>
        <button class="tile" type="button" data-cat="corporate" data-room="ivory" data-title="Client reception" data-caption="Ivory Suite, boardroom reception">
          <span class="media" data-img="gallery-8" role="img" aria-label="Client reception"></span>
          <span class="tile-cap"><strong>Client reception</strong><br>Ivory Suite, boardroom reception</span>
        </button>
        <button class="tile" type="button" data-cat="decor" data-room="ivory" data-title="Table centrepiece" data-caption="Ivory Suite, table decor">
          <span class="media" data-img="gallery-9" role="img" aria-label="Table centrepiece"></span>
          <span class="tile-cap"><strong>Table centrepiece</strong><br>Ivory Suite, table decor</span>
        </button>
      </div>

      <p class="empty-state" id="gallery-empty" hidden>No photos match these filters yet. Try another occasion or room.</p>
    </div>
  </section>

</main>

<dialog id="lightbox" aria-labelledby="lb-title">
  <div class="lightbox">
    <span class="media" id="lb-media" role="img" aria-label="Enlarged photo"></span>
    <div class="lb-bar">
      <div>
        <h2 id="lb-title"></h2>
        <p class="note" id="lb-cap"></p>
      </div>
      <div class="lb-nav">
        <button class="icon-btn" id="lb-prev" type="button" aria-label="Previous photo">&larr;</button>
        <button class="icon-btn" id="lb-next" type="button" aria-label="Next photo">&rarr;</button>
        <button class="icon-btn" id="lb-close" type="button" aria-label="Close photo viewer">&times;</button>
      </div>
    </div>
  </div>
</dialog>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/images.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/gallery.js"></script>
</body>
</html>
